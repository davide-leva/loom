<span class="version-badge"
      role="status"
      [attr.aria-label]="tooltipText()"
      [pTooltip]="tooltipText()"
      tooltipPosition="left"
      [escape]="false"
      showDelay="150"
      hideDelay="50">
  <i class="pi pi-code" aria-hidden="true"></i>
  <span class="version-badge__label">{{ label() }}</span>
  @if (info()?.environment === 'dev') {
    <span class="version-badge__env is-dev">dev</span>
  }
</span>
