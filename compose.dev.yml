services:
  database:
    image: postgres:16-alpine
    container_name: loom-database
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-dbaloom}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-loom}
    ports:
      - "127.0.0.1:5432:5432"
    expose:
      - "5432"
    volumes:
      - ./data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  loom:
    image: loom:dev
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        VERSION: ${APP_VERSION:-dev}
        COMMIT: ${APP_COMMIT:-local}
        BUILD_TIME: ${APP_BUILD_TIME:-local}
    container_name: loom
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://database:5432/${DB_NAME:-loom}
      DB_USER: ${DB_USER:-dbaloom}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-480}
      ATTACHMENTS_ROOT_FOLDER: /data/attachments
      ROOT_FOLDER: /data/branding
      ATTACHMENTS_MAX_FILE_SIZE: ${ATTACHMENTS_MAX_FILE_SIZE:-25MB}
      MAIL_NOTIFICATIONS_ENABLED: ${MAIL_NOTIFICATIONS_ENABLED:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@loom.local}
      MAIL_NOTIFICATIONS_DELAY: ${MAIL_NOTIFICATIONS_DELAY:-5m}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS_ENABLE: ${SMTP_STARTTLS_ENABLE:-false}
      APP_VERSION: ${APP_VERSION:-dev}
      APP_COMMIT: ${APP_COMMIT:-local}
      APP_BUILD_TIME: ${APP_BUILD_TIME:-local}
      APP_ENV: ${APP_ENV:-dev}
    expose:
      - "8080"
    volumes:
      - ./data/attachments:/data/attachments
      - ./data/branding:/data/branding

  caddy:
    image: caddy:2-alpine
    container_name: loom-caddy
    restart: unless-stopped
    depends_on:
      - loom
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
