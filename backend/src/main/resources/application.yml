spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/loom}
    username: ${DB_USER:dbaloom}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        session_factory:
          statement_inspector: it.davideleva.loom.logging.SqlTraceInspector
  servlet:
    multipart:
      max-file-size: ${ATTACHMENTS_MAX_FILE_SIZE:25MB}
      max-request-size: ${ATTACHMENTS_MAX_FILE_SIZE:25MB}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:25}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:false}

app:
  jwt:
    issuer: loom
    ttl-minutes: ${JWT_TTL_MINUTES:480}
    secret: ${JWT_SECRET}
  attachments:
    root-folder: ${ATTACHMENTS_ROOT_FOLDER:./attachments}
    max-file-size: ${ATTACHMENTS_MAX_FILE_SIZE:25MB}
  branding:
    root-folder: ${ROOT_FOLDER:./branding}
  version:
    value: ${APP_VERSION:dev}
    commit: ${APP_COMMIT:local}
    build-time: ${APP_BUILD_TIME:local}
    api: v1

  notifications:
    email:
      enabled: ${MAIL_NOTIFICATIONS_ENABLED:false}
      from: ${MAIL_FROM:no-reply@loom.local}
      scheduler-delay: ${MAIL_NOTIFICATIONS_DELAY:5m}
      # Events must be at least this old before their digest is sent. Default 5 minutes —
      # gives authors a brief grace window to back out a recent change before it reaches
      # inboxes. Supports both ISO-8601 (PT5M) and Spring's short form (5m).
      min-event-age: ${MAIL_NOTIFICATIONS_MIN_AGE:5m}
      # Notifications older than this are dropped without sending.
      digest-window: ${MAIL_NOTIFICATIONS_DIGEST_WINDOW:48h}

  archive:
    enabled: ${ARCHIVE_ENABLED:true}
    check-interval: ${ARCHIVE_CHECK_INTERVAL:60m}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    it.davideleva.loom: ${LOG_LEVEL_APP:INFO}
    org.springframework.web: ${LOG_LEVEL_WEB:WARN}
    org.springframework.security: ${LOG_LEVEL_SECURITY:WARN}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:WARN}
    org.hibernate.orm.jdbc.bind: ${LOG_LEVEL_SQL_BIND:WARN}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
