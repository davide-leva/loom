services:
  database:
    image: postgres:16-alpine
    container_name: tickets-database
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-dbatickets}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-tickets}
    expose:
      - "5432"
    volumes:
      - ./data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/davide-leva/ticket-platform/backend:latest
    container_name: tickets-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://database:5432/${DB_NAME:-tickets}
      DB_USER: ${DB_USER:-dbatickets}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ATTACHMENTS_ROOT_FOLDER: /data/attachments
      ROOT_FOLDER: /data/branding
      ATTACHMENTS_MAX_FILE_SIZE: ${ATTACHMENTS_MAX_FILE_SIZE:-25MB}
      MAIL_NOTIFICATIONS_ENABLED: ${MAIL_NOTIFICATIONS_ENABLED:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@tickets.local}
      MAIL_NOTIFICATIONS_DELAY: ${MAIL_NOTIFICATIONS_DELAY:-5m}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS_ENABLE: ${SMTP_STARTTLS_ENABLE:-false}
    expose:
      - "8080"
    volumes:
      - ./data/attachments:/data/attachments
      - ./data/branding:/data/branding

  frontend:
    image: ghcr.io/davide-leva/ticket-platform/frontend:latest
    container_name: tickets-frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - .env
    environment:
      NGINX_CLIENT_MAX_BODY_SIZE: ${ATTACHMENTS_MAX_REQUEST_SIZE:-25M}
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    container_name: tickets-caddy
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config