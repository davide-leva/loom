name: version-check

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Verify VERSION bumped with code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check VERSION bump
        run: bash scripts/check-version-bump.sh
